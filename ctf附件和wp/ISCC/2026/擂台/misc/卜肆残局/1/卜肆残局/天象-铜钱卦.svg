          <title>天象铜钱卦</title>
          <desc>看图者多误入色相，懂的人只记画，不记辞。铜钱十六，内外各有旧说。</desc>
          <metadata>
            旧摊钞记：
            铜钱十六，外八内八。
            天盘依文王位，记文仍从伏羲次。
            离坤兑乾坎艮震巽。
            乾兑离震巽坎艮坤。
            坎坤震巽中乾兑艮离。
            492357816。
            qianli-kunzi-2024。
            cWlhbl9rdW5fa2FuX2xp
            边角又记：外内同宫，不同周。
          </metadata>
