load_module /opt/cacheline/cacheline.so;

worker_processes 1;
daemon off;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    access_log off;
    default_type text/plain;
    client_header_timeout 60s;
    keepalive_timeout 120s;
    server {
        listen 9999;
        location / {
        }
    }
}
